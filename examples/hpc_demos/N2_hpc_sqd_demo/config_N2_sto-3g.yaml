# N2 / STO-3G SQD demo configuration
#
# QPU credentials are NOT stored here.
# They are read from environment variables set by the Slurm SPANK plugin on SCC,
# or exported manually for local testing. See 02_run_sqd.py for details.

# ============================================================================
# QPU Configuration
# ============================================================================
qpu:
  provider: "qrmi"
  backend_name: "ibm_pittsburgh"  # must match QRMI_JOB_QPU_RESOURCES in .qrmi_config

  sampler_options:
    default_shots: 1000000

# ============================================================================
# SQD Solver Configuration
# ============================================================================
sqd:
  # LUCJ ansatz parameters.
  # Circuit layout and routing are handled by ffsim's lucj_pass_manager;
  # max_connection / connect_every_n are no longer used.
  lucj:
    n_reps: 1

  # Transpilation options (passed to ffsim lucj_pass_manager)
  transpilation:
    optimization_level: 0
    seed_transpiler: 42

  # SQD algorithm parameters
  # classical_backend: python uses stock qiskit-addon-sqd; hpc uses C++ bindings
  classical_backend: python
  symmetrize_spin: true
  n_batches: 5
  iterations: 10
  samples_per_batch: 3000
  energy_tol: 1.e-8
  occupancies_tol: 1.e-5
  carryover_threshold: 1.e-4
  add_hf_string: true

  # SBD solver options — sbd-eigensolver Python bindings (container v4.0+)
  sbd:
    device: cpu
    mpi_ranks: 1
