# Bortezomib isolated ligand  —  STO-3G  EWF+SQD configuration
#
# System:  bortezomib bound-geometry extracted ligand (three-coordinate boronic acid)
#          53 atoms  |  charge = 0  |  spin = 0
#
# The ligand is neutral after extraction: the tetrahedral B-O-Thr1 covalent
# bond is broken and the B returns to a three-coordinate R-B(OH)2 reference
# state.  Both B-bound oxygens retain their hydrogens.
# See system_prep/README.md for full charge-assignment rationale.
#
# QPU credentials are NOT stored here — injected via run_workflow.sh.

# ============================================================================
# Workflow / Molecule
# ============================================================================
workflow:
  xyz_file: bortezomib_ligand.xyz    # path relative to this config file
  basis: sto-3g
  charge: 0
  spin: 0

# ============================================================================
# Embedder Configuration
# ============================================================================
embedder:
  ewf:
    bath_type: mp2
    truncation: 1.0e-5
    fragmentation: iao

# ============================================================================
# Solver Selection
# ============================================================================
solver_selection:
  strategy: adaptive
  orbital_threshold: 15

# ============================================================================
# QPU Configuration
# ============================================================================
qpu:
  provider: qrmi
  backend_name: ibm_kingston

  sampler_options:
    default_shots: 1000000

# ============================================================================
# SQD Solver Configuration
# ============================================================================
sqd:
  # Circuit layout and routing are handled by ffsim's lucj_pass_manager;
  # max_connection / connect_every_n are no longer used.
  lucj:
    n_reps: 1

  classical_backend: python
  symmetrize_spin: true
  n_batches: 5
  iterations: 10
  samples_per_batch: 3000
  energy_tol: 1.e-8
  occupancies_tol: 1.e-5
  carryover_threshold: 1.e-4

  sbd:
    device: cpu          # → gpu once GPU container is built
                         # (OMP_NUM_THREADS from SLURM covers all 96 CPUs per fragment).
                         # Raise and launch with "mpirun -np N python ..." to distribute
                         # batches across ranks (MPI parallelism sub-task).

  # Circuit persistence — ISA circuit saved per fragment in QPY format.
  circuit_save_dir: circuits
