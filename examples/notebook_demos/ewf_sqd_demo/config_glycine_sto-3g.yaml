# Glycine / STO-3G  EWF+SQD notebook demo configuration
#
# System: glycine (H2N-CH2-COOH), 10 atoms, simplest amino acid
# Basis:  STO-3G
#
# IAO fragmentation with MP2 bath (truncation=1e-4) produces 10 fragments:
#   Fragment 0  — N   (~11 orb)  → SQD   ← the one QPU fragment
#   Fragment 1  — Cα  (~10 orb)  → FCI
#   Fragment 2  — C   (~9 orb)   → FCI
#   Fragment 3  — O   (~8 orb)   → FCI
#   Fragment 4  — O   (~8 orb)   → FCI
#   Fragments 5–9 — H  (1–3 orb) → FCI
#
# orbital_threshold: 11  →  fragments with n_orb < 11 use FCI; N-fragment uses SQD.
#
# QPU credentials are NOT stored here — they live in .env (gitignored).
# See .env.example for the required environment variables.

# ============================================================================
# Workflow / Molecule
# ============================================================================
workflow:
  xyz_file: system_glycine.xyz   # path relative to this config file
  basis: sto-3g

# ============================================================================
# Embedder Configuration
# ============================================================================
embedder:
  ewf:
    bath_type: mp2
    truncation: 1.0e-4            # looser than HPC (1e-5) to keep fragment sizes down
    fragmentation: iao

# ============================================================================
# Solver Selection
# ============================================================================
# Three-tier adaptive strategy:
#   n_orb ≤ 10  → FCI   (H fragments: 3–4 orb)
#   n_orb ≤ 18  → CCSD  (N:13, Cα:17, O:13 fragments)
#   n_orb ≥ 19  → SQD   (C=O carbonyl: 19 orb, 38 qubits) ← only QPU fragment
#
# Fragment cluster sizes at truncation=1e-4 (active orbitals):
#   Frag 0 N   : 13  → CCSD
#   Frag 1 Cα  : 17  → CCSD
#   Frag 2 C=O : 19  ← SQD  (only fragment at QPU threshold)
#   Frag 3 O   : 13  → CCSD
#   Frag 4 O   : 13  → CCSD
#   Frags 5–9 H: 3–4 → FCI
solver_selection:
  strategy: adaptive
  fci_threshold: 10     # n_orb ≤ this → FCI
  ccsd_threshold: 18    # fci_threshold < n_orb ≤ this → CCSD
  sqd_threshold: 19     # n_orb ≥ this → SQD

# ============================================================================
# QPU Configuration — backend name only (no credentials here)
# Credentials are loaded from .env via QRMI environment variables.
# ============================================================================
qpu:
  provider: qrmi
  backend_name: ibm_kingston      # must match QRMI_JOB_QPU_RESOURCES in .env
  sampler_options:
    default_shots: 100000         # 100k shots — sufficient for demo
    dynamical_decoupling:
      enable: true
      sequence_type: XY4
    twirling:
      enable_gates: false
      enable_measure: false

# ============================================================================
# SQD Solver Configuration
# ============================================================================
sqd:
  lucj:
    n_reps: 1
    max_connection: 18            # ≤ norb-1 = 18; caps alpha-beta interaction range
    connect_every_n: 4

  # classical_backend: python — stock qiskit-addon-sqd (no C++ needed on laptop)
  # NOTE: norb=19 FCI is intractable without max_dim. On HPC use classical_backend: sbd.
  classical_backend: python
  symmetrize_spin: true
  n_batches: 1
  iterations: 3
  samples_per_batch: 300
  max_dim: 2000              # cap CI subspace — keeps FCI tractable on laptop
  energy_tol: 1.e-8
  occupancies_tol: 1.e-5
  carryover_threshold: 1.e-4
