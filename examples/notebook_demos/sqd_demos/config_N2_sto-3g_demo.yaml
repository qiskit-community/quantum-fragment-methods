# N₂ / STO-3G  SQD notebook demo configuration
#
# Credentials are read from environment variables (.env), not from this file.
# See .env.example in this directory.

# ============================================================================
# QPU Configuration
# ============================================================================
qpu:
  provider: qrmi
  backend_name: ibm_kingston     # must match QRMI_JOB_QPU_RESOURCES

  sampler_options:
    default_shots: 100000
    dynamical_decoupling:
      enable: true
      sequence_type: XY4
    twirling:
      enable_gates: false
      enable_measure: false

# ============================================================================
# SQD Solver Configuration
# ============================================================================
sqd:
  lucj:
    n_reps: 1

  # classical_backend: python — stock qiskit-addon-sqd (no C++ needed on laptop)
  # classical_backend: sbd    — sbd-eigensolver bindings (HPC/GPU)
  classical_backend: python
  symmetrize_spin: true
  n_batches: 1
  iterations: 3
  samples_per_batch: 200
  energy_tol: 1.e-8
  occupancies_tol: 1.e-5
  carryover_threshold: 1.e-4

  # sbd: only used when classical_backend: sbd
  sbd:
    device: cpu
